name: SupportFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Bygg API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/SupportFlow.Api

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Installera beroenden
        run: dotnet restore

      - name: Bygg API
        run: dotnet build --configuration Release --no-restore

  frontend:
    name: Bygg Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        run: npx --yes npm@11 ci

      - name: Bygg Angular
        run: npm run build