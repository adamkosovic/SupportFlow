<section class="stats-grid" aria-label="Statistik över supportärenden">
  @for (stat of stats(); track stat.type) {
    <article class="stat-card" [class]=" 'stat-card ' + stat.type">
      <div class="stat-heading">
        <h2>{{ stat.label }}</h2>
        <span class="stat-dot" aria-hidden="true"></span>
      </div>

      <p class="stat-value">{{ stat.value }}</p>
      <p class="stat-description">Supportärenden</p>
    </article>
  }
</section>
