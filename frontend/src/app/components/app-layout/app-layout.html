<div class="app-shell">
  <aside class="sidebar" aria-label="Sidopanel">
    <a class="brand" routerLink="/tickets" aria-label="SupportFlow startsida">
      <span class="brand-icon" aria-hidden="true">S</span>

      <span>
        <strong>SupportFlow</strong>
        <small>IT-supportportal</small>
      </span>
    </a>

    <div class="sidebar-section">
      <p class="section-label">ARBETSYTA</p>

      <nav aria-label="Huvudmeny">
        <a
          class="nav-link"
          routerLink="/dashboard"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <span class="nav-icon" aria-hidden="true">▦</span>
          Översikt
        </a>
      
        <a
          class="nav-link"
          routerLink="/tickets"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <span class="nav-icon" aria-hidden="true">☷</span>
          Ärenden
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <span class="footer-dot" aria-hidden="true"></span>
      <span>En plats för din IT-support</span>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <nav class="breadcrumb" aria-label="Brödsmulor">
        <span>Arbetsyta</span>
        <span class="separator" aria-hidden="true">/</span>
      
        @if (isDashboard()) {
          <strong aria-current="page">Översikt</strong>
        } @else if (isCreateTicket()) {
        <a routerLink="/tickets">Ärenden</a>
        <span class="separator" aria-hidden="true">/</span>
        <strong aria-current="page">Nytt ärende</strong>
        } @else if (ticketId(); as id) {
          <a routerLink="/tickets">Ärenden</a>
          <span class="separator" aria-hidden="true">/</span>
          <strong aria-current="page">#{{ id }}</strong>
        } @else {
          <strong aria-current="page">Ärenden</strong>
        }
      </nav>

      <span class="workspace-label">Supportportal</span>
    </header>

    <div class="page-content">
      <ng-content />
    </div>
  </div>
</div>
